apiVersion: v1
kind: Pod
metadata:
  name: pvc-test
  namespace: ivolve
spec:
  containers:
    - name: busybox
      image: busybox
      command: ["sh", "-c", "echo 'hello from pod' > /logs/test.log && sleep 3600"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      persistentVolumeClaim:
        claimName: ivolvepvc